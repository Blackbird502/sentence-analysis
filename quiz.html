<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<style>
:root{--bg:#F5F6F0;--fg:#23271F;--muted:#666C5E;--line:#D7DBCB;--panel:#FFFFFF;--accent:#4E6B38;--accent-ink:#FFFFFF;--soft:#E3EAD8;--bad:#9C2B22;--badsoft:#F6E3E0;
 --serif:"Century Schoolbook","New Century Schoolbook","C059","TeX Gyre Schola",Georgia,serif;--sans:Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.5;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:14px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--serif);font-size:1.6rem;margin:0}
.intro{margin:0;color:var(--muted)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px}
.q h2{font-family:var(--serif);font-size:1.12rem;margin:0;line-height:1.3}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px 12px;cursor:pointer;color:var(--fg)}
.opt b{color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{background:var(--soft);border-color:var(--accent)}
.opt.wrong{background:var(--badsoft);border-color:var(--bad)}
.fb{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 4px 4px 0}
.fb.no{border-color:var(--bad);background:var(--badsoft)}
.fb strong{display:block}
.score{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.score p{margin:0;font-weight:700}
button.again{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="intro">Choose an answer for each question. You'll see right away whether it's correct, and why.</p>
  <div id="qs" style="display:grid;gap:12px"></div>
  <div class="score"><p id="score" aria-live="polite"></p><button class="again" id="again" type="button">Start over</button></div>
</div>
<script>
const DATA={"l1":[{"q":"What is sentence analysis mainly about?","opts":["What kind of word each one is on its own","How each word is spelled and pronounced","What each word is doing in the sentence","Where each word falls in the sentence order"],"a":2,"fb":"The question is never just what kind of word it is. It's what that word is doing in the sentence."},{"q":"Which students is John's approach mainly aimed at?","opts":["Fourth and fifth graders, though younger and older can use it","Second and third graders who are still learning to read well","Seventh and eighth graders preparing for high school English","High school students reviewing grammar before college tests"],"a":0,"fb":"Mostly fourth and fifth graders. It can work with third graders, and many sixth graders haven't seen it either."},{"q":"Why does sentence analysis work in most languages, according to John?","opts":["Most languages put their words in the very same order","Every language places its adjectives before the noun","The symbols were first designed for translation work","Each role answers the same question in any language"],"a":3,"fb":"A word may sit in a different place in another language, but the question it answers stays the same."},{"q":"What does the Latin word nomen mean?","opts":["A word that names an action or an event","The Latin word for both noun and name","The subject of a sentence or a clause","The Montessori symbol used for a noun"],"a":1,"fb":"Nomen is the Latin word for noun and the Latin word for name. A chair is a chair because somebody named it."},{"q":"What makes the Montessori approach more accessible than sentence diagramming?","opts":["It skips the parts of speech that students find confusing","It uses fewer terms and leaves the objects out entirely","It is taught only out loud, with no written work at all","Color, shape, size and position, and pieces you can move"],"a":3,"fb":"Colors, shapes, sizes and relative positions all carry meaning, and students get to move the pieces around."},{"q":"How does John answer a parent who asks why their child has to learn this?","opts":["If you don't know it, you won't get a job that requires it","Every job eventually requires knowing indirect objects","Grammar scores matter a great deal on later state tests","It is required by the standards, so it has to be taught"],"a":0,"fb":"It's like asking why learn algebra. You don't know that you won't need it, and it opens up the beauty of the language."}],"l2":[{"q":"In sentence analysis, which question always comes first?","opts":["Who or what is doing the action here?","What's going on in this sentence?","Which word is the most important noun?","What kind of word is each one here?"],"a":1,"fb":"Every sentence starts with what's going on. The detective's first question never changes."},{"q":"Why is the simple predicate the largest symbol in the analysis?","opts":["It is usually the longest word in the sentence","It always comes first when the sentence is read","It is the word students find most easily at first","It is the most important word in the sentence"],"a":3,"fb":"Size shows importance. The predicate is the most important word in the sentence, so it gets the biggest circle."},{"q":"In “Ben bought some popcorn,” which word is the simple subject, and why?","opts":["Ben, because he is the noun doing the predicate","Popcorn, because it is the noun named at the end","Bought, because it is the word that tells the action","Some, because it tells which popcorn was bought"],"a":0,"fb":"Ask who or what bought. Ben bought. The simple subject is the noun doing the predicate."},{"q":"Why does the noun become a circle in sentence analysis?","opts":["Circles are easier for students to draw by hand","The triangle is saved for objects in later lessons","Nouns relating to the predicate orbit it like planets","A circle shows the noun comes before the verb"],"a":2,"fb":"A sentence is like a solar system. The predicate is the sun, and the nouns that relate to it orbit it like planets."},{"q":"Where does the simple subject go in the analysis?","opts":["To the right of the predicate, on a red arrow","To the left of the predicate, on a black arrow","Below the predicate, on an arrow pointing down","Under its word in the sentence, on the same line"],"a":1,"fb":"The simple subject sits to the left of the predicate, on a black arrow with its flat side against the predicate."},{"q":"Why does John teach the simple predicate and simple subject in the same lesson?","opts":["The two are hard to understand without each other","Students usually already know both from earlier grades","The first lesson needs extra content to fill the time","Both use the same symbol, so one lesson is enough"],"a":0,"fb":"It's really hard to understand the predicate without the subject, and vice versa, so they're taught together."}]};
const NAMES={l1:"Lesson 1: Why Sentence Analysis",l2:"Lesson 2: Predicate and Subject"};
const key=((/#(l\d+)/.exec(location.hash)||[])[1])||"l1";
const qs=DATA[key]||DATA.l1, L="ABCD";
document.getElementById("eyebrow").textContent="Lesson check";
document.getElementById("title").textContent=NAMES[key]||"Lesson check";
let answered=0, right=0;
function score(){document.getElementById("score").textContent=answered<qs.length?`${answered} of ${qs.length} answered · ${right} correct`:`Done: ${right} of ${qs.length} correct${right===qs.length?". Well done.":". Review the ones you missed, then start over if you like."}`;}
function build(){
  answered=0;right=0;const box=document.getElementById("qs");box.innerHTML="";
  qs.forEach((it,i)=>{
    const d=document.createElement("section");d.className="q";
    const h=document.createElement("h2");h.textContent=`${i+1}. ${it.q}`;d.appendChild(h);
    const o=document.createElement("div");o.className="opts";o.setAttribute("role","group");o.setAttribute("aria-label",`Question ${i+1} answers`);
    it.opts.forEach((t,k)=>{
      const b=document.createElement("button");b.type="button";b.className="opt";b.innerHTML=`<b>${L[k]}</b><span></span>`;b.querySelector("span").textContent=t;
      b.addEventListener("click",()=>{
        o.querySelectorAll("button").forEach((x,j)=>{x.disabled=true;if(j===it.a)x.classList.add("right");});
        const ok=k===it.a; if(!ok)b.classList.add("wrong");
        answered++; if(ok)right++;
        const f=document.createElement("p");f.className="fb"+(ok?"":" no");f.innerHTML=`<strong>${ok?"That's right.":"Not quite."}</strong><span></span>`;f.querySelector("span").textContent=it.fb;d.appendChild(f);
        score();
      });
      o.appendChild(b);
    });
    d.appendChild(o);box.appendChild(d);
  });
  score();
}
document.getElementById("again").addEventListener("click",()=>{build();window.scrollTo(0,0);});
build();
</script>
</body>
</html>
